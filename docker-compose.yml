services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doubt-postgres
    environment:
      POSTGRES_USER: doubt
      POSTGRES_PASSWORD: doubt_pass
      POSTGRES_DB: doubtsolver
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: doubt-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: