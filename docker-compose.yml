services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doubt-postgres
    environment:
      POSTGRES_USER: doubt
      POSTGRES_PASSWORD: doubt_pass
      POSTGRES_DB: doubtsolver
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doubt -d doubtsolver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: doubt-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: doubt-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  ai-service:
    build: ./ai-service
    container_name: doubt-ai
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:?Add GEMINI_API_KEY to the .env file}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini-3.8-flash}"
      FALLBACK_MODEL: "${FALLBACK_MODEL:-gemini-3.1-flash-lite}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      EMBED_MODEL: "${EMBED_MODEL:-gemini-embedding-001}"
      MAX_DISTANCE: "${MAX_DISTANCE:-0.43}"
      DATABASE_URL: "postgresql://doubt:doubt_pass@postgres:5432/doubtsolver"
      MONGO_URL: "mongodb://mongo:27017"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  gateway:
    build: ./gateway
    container_name: doubt-gateway
    environment:
      PORT: "3000"
      AI_SERVICE_URL: "http://ai-service:8000"
      GRPC_URL: "ai-service:50051"
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://doubt:doubt_pass@postgres:5432/doubtsolver"
      JWT_SECRET: "${JWT_SECRET:?Add JWT_SECRET to the .env file}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: doubt-frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  mongodata: