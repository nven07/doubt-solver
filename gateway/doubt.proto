syntax = "proto3";

package doubt;

service Assistant {
  rpc AskStream (AskRequest) returns (stream AskChunk);
}

message AskRequest {
  string question = 1;
  int64 user_id = 2;
}

message Start {
  string tool = 1;
  repeated string sources = 2;
}

message AskChunk {
  oneof kind {
    Start start = 1;
    string text = 2;
  }
}